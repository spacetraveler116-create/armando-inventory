    const unsub = auth.onAuthStateChanged(u => {
      if (u) setUser(u);
      else auth.signInAnonymously().catch(err => { console.error(err); setUser(null); });
    });
    return unsub;
  }, []);
  return user;
}

function useFirebaseList(path){
  const [data, setData] = useState(null);
  const [connected, setConnected] = useState(true);
  useEffect(() => {
    const ref = db.ref(path);
    const cb = ref.on("value", snap => {
      const val = snap.val();
      setData(val ? Object.values(val) : []);
      setConnected(true);
    }, err => { console.error(err); setConnected(false); });
    return () => ref.off("value", cb);
  }, [path]);
  return [data, connected];
}

  }, []);

  const findItemBySku = useCallback((sku) => (items || []).find(i => i.sku === sku), [items]);

  const addLogEntry = useCallback((entry) => {
    const id = uid();
    db.ref("changelog/" + id).set({ id, ts: Date.now(), ...entry }).catch(() => {});
  }, []);

    if (findItemBySku(item.sku)) { showToast("SKU already exists in stock"); return false; }

    try {
      await db.ref("items/" + id).set({ ...item, id, addedAt: Date.now() });

      showToast(`Added ${item.model} to inventory`);
      return true;
    } catch (err) {
      showToast("Failed to save — check connection");
      return false;
    }
  }, [findItemBySku, addLogEntry, showToast]);

  const handleDeleteItem = useCallback(async (sku) => {
    const item = findItemBySku(sku);
    if (!item) return;
    try {
      await db.ref("items/" + item.id).remove();
      addLogEntry({ type: "delete", sku, detail: "Removed from inventory" });
      showToast("Item removed");
      setConfirmDeleteSku(null);
    } catch (err) {
      showToast("Failed to remove — check connection");
    }
  }, [findItemBySku, addLogEntry, showToast]);

  const handleSellItem = useCallback(async (sku, soldPrice, platform) => {
    const item = findItemBySku(sku);
    if (!item) { showToast("Item not found in stock"); return false; }
    const cost = Number(item.cost) || 0;
    const price = Number(soldPrice) || 0;
    const profit = round2(price - cost);
    const saleId = uid();

      id: saleId, sku: item.sku, rack: item.rack, brand: item.brand, model: item.model,
      storage: item.storage, color: item.color, carrier: item.carrier, imei: item.imei,
      condition: item.condition, notes: item.notes, cost, soldPrice: price, profit,
      date: todayStr(), timestamp: Date.now(), platform: platform || "Facebook Marketplace"

    try {
      const updates = {};
      updates["sales/" + saleId] = saleRecord;
      updates["items/" + item.id] = null;

      addLogEntry({ type: "sell", sku, detail: `Sold for $${price} (profit $${profit})` });

      showToast("Failed to log sale — check connection");
      return false;

      condition: sale.condition, notes: sale.notes, cost: sale.cost, addedAt: Date.now()

      const updates = {};

    let cancelled = false;

    function tick(){
      if (cancelled || !videoRef.current || !canvasRef.current) return;
      const video = videoRef.current, canvas = canvasRef.current;
      if (typeof window.jsQR !== "function") {
        scanLoopRef.current = requestAnimationFrame(tick);
        return;
      }
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.height = video.videoHeight; canvas.width = video.videoWidth;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = window.jsQR(imageData.data, imageData.width, imageData.height);
        if (code && code.data) { onScanSuccess(code.data); return; }
      }
      scanLoopRef.current = requestAnimationFrame(tick);
    }

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showToast("Camera not supported in this browser — use manual entry");
      setScannerOpen(false);
    } else {
      navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } }, audio: false })

          const video = videoRef.current;
          if (!video) return;
          video.srcObject = stream;
          video.onloadedmetadata = () => {

          setScannerOpen(false);
        });
    }

    return () => {
      cancelled = true;
      if (scanLoopRef.current) cancelAnimationFrame(scanLoopRef.current);

function downloadCSV(filename, rows, headers){
  const esc = v => {
    const s = v === null || v === undefined ? "" : String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const lines = [headers.map(esc).join(",")].concat(
    rows.map(r => headers.map(h => esc(r[h])).join(","))
  );
  const blob = new Blob([lines.join("\n")], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function SalesTab({ sales, onUndo }){

    return sales.filter(s => {
      if (!s.timestamp) return true;
      const d = new Date(s.timestamp);
      if (fromDate && d < new Date(fromDate)) return false;
      if (toDate && d > new Date(new Date(toDate).getTime() + 86400000 - 1)) return false;
      return true;
    }).sort((a,b) => (b.timestamp||0) - (a.timestamp||0));
  }, [sales, fromDate, toDate]);

  const exportCSV = () => {
    downloadCSV(
      `sales_export_${new Date().toISOString().slice(0,10)}.csv`,
      filtered,
      ["sku","brand","model","storage","color","carrier","condition","cost","soldPrice","profit","platform","date"]
    );
  };

  return e("div", null,
    e("div", { style: { display: "flex", gap: 6, marginBottom: 10, alignItems: "flex-end" } },

        e("input", { type: "date", value: fromDate, onChange: ev => setFromDate(ev.target.value), style: { width: "100%" } })

      e("div", { style: { flex: 1 } },
        e("label", { style: { fontSize: 11, color: "var(--text-secondary)" } }, "To"),
        e("input", { type: "date", value: toDate, onChange: ev => setToDate(ev.target.value), style: { width: "100%" } })

function DailyTab({ sales }){
  const [selectedDate, setSelectedDate] = React.useState(new Date().toISOString().slice(0,10));

  const dayKey = ts => new Date(ts).toISOString().slice(0,10);

  const byDay = React.useMemo(() => {
    const map = {};
    sales.forEach(s => {
      if (!s.timestamp) return;
      const k = dayKey(s.timestamp);
      if (!map[k]) map[k] = { count: 0, revenue: 0, cost: 0, profit: 0, items: [] };
      map[k].count += 1;
      map[k].revenue += Number(s.soldPrice) || 0;
      map[k].cost += Number(s.cost) || 0;
      map[k].profit += Number(s.profit) || 0;
      map[k].items.push(s);
    });
    return map;
  }, [sales]);

  const selected = byDay[selectedDate] || { count: 0, revenue: 0, cost: 0, profit: 0, items: [] };

  const last7 = React.useMemo(() => {
    const out = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date(); d.setDate(d.getDate() - i);
      const k = d.toISOString().slice(0,10);
      out.push({ key: k, label: d.toLocaleDateString(undefined,{weekday:"short"}), profit: (byDay[k]||{profit:0}).profit });
    }
    return out;
  }, [byDay]);

  const maxProfit = Math.max(1, ...last7.map(d => Math.abs(d.profit)));

  return e("div", null,
    e("div", { style: { marginBottom: 14 } },
      e("label", { style: { fontSize: 11, color: "var(--text-secondary)" } }, "Select day"),
      e("input", { type: "date", value: selectedDate, onChange: ev => setSelectedDate(ev.target.value), style: { width: "100%" } })
    ),

    e("div", { style: { display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8, marginBottom: 16 } },
      e("div", { style: { background: "var(--surface-1)", borderRadius: "var(--radius)", padding: "0.65rem 0.75rem" } },
        e("div", { style: { fontSize: 11, color: "var(--text-secondary)" } }, "Sold"),
        e("div", { style: { fontSize: 18, fontWeight: 600 } }, selected.count)),
      e("div", { style: { background: "var(--surface-1)", borderRadius: "var(--radius)", padding: "0.65rem 0.75rem" } },
        e("div", { style: { fontSize: 11, color: "var(--text-secondary)" } }, "Revenue"),
        e("div", { style: { fontSize: 18, fontWeight: 600 } }, "$" + selected.revenue.toLocaleString(undefined,{maximumFractionDigits:0}))),
      e("div", { style: { background: "var(--surface-1)", borderRadius: "var(--radius)", padding: "0.65rem 0.75rem" } },
        e("div", { style: { fontSize: 11, color: "var(--text-secondary)" } }, "Profit"),
        e("div", { style: { fontSize: 18, fontWeight: 600, color: selected.profit >= 0 ? "var(--text-success)" : "var(--text-danger)" } }, "$" + selected.profit.toLocaleString(undefined,{maximumFractionDigits:0})))
    ),

    e("div", { style: { fontSize: 13, fontWeight: 600, marginBottom: 8 } }, "Last 7 days"),
    e("div", { style: { display: "flex", alignItems: "flex-end", gap: 6, height: 90, marginBottom: 20 } },
      last7.map(d => {
        const h = Math.max(4, Math.round((Math.abs(d.profit) / maxProfit) * 70));
        const isSelected = d.key === selectedDate;
        return e("div", { key: d.key, onClick: () => setSelectedDate(d.key), style: { flex: 1, display: "flex", flexDirection: "column", alignItems: "center", cursor: "pointer" } },
          e("div", { style: { width: "100%", height: h, borderRadius: 4, background: isSelected ? "var(--border-accent)" : (d.profit >= 0 ? "#a8d5b5" : "#e8b4b0") } }),
          e("div", { style: { fontSize: 10, color: "var(--text-secondary)", marginTop: 4 } }, d.label)
        );
      })
    ),

    e("div", { style: { fontSize: 13, fontWeight: 600, marginBottom: 8 } }, `Sales on ${selectedDate}`),
    selected.items.length === 0 && e("div", { style: { textAlign: "center", padding: "1.5rem 0", color: "var(--text-secondary)", fontSize: 13 } }, "No sales this day."),
    e("div", { style: { display: "flex", flexDirection: "column", gap: 6 } },
      selected.items.map(s =>
        e("div", { key: s.id, style: { display: "flex", justifyContent: "space-between", fontSize: 13, padding: "0.4rem 0", borderBottom: "0.5px solid var(--border)" } },
          e("span", null, `${s.brand || ""} ${s.model || ""}`),
          e("span", { style: { color: s.profit >= 0 ? "var(--text-success)" : "var(--text-danger)" } }, `$${s.soldPrice} (${s.profit >= 0 ? "+" : ""}$${s.profit})`)
        )
      )
    )
  );
}

function ReportsTab({ sales, items }){
  const [groupBy, setGroupBy] = React.useState("platform");

  const groups = React.useMemo(() => {
    const map = {};
    sales.forEach(s => {
      const key = groupBy === "platform"
        ? (s.platform || "Unknown")
        : (s.brand || "Unknown");
      if (!map[key]) map[key] = { key, count: 0, revenue: 0, cost: 0, profit: 0 };
      map[key].count += 1;
      map[key].revenue += Number(s.soldPrice) || 0;
      map[key].cost += Number(s.cost) || 0;
      map[key].profit += Number(s.profit) || 0;
    });
    return Object.values(map).sort((a, b) => b.profit - a.profit);
  }, [sales, groupBy]);

  const agingItems = React.useMemo(() => {
    return (items || [])
      .map(i => ({ ...i, daysInStock: i.addedAt ? Math.floor((Date.now() - i.addedAt) / 86400000) : 0 }))
      .filter(i => i.daysInStock >= 30)
      .sort((a, b) => b.daysInStock - a.daysInStock);
  }, [items]);

  return e("div", null,
    agingItems.length > 0 && e("div", { style: { marginBottom: 20 } },
      e("div", { style: { fontSize: 13, fontWeight: 600, marginBottom: 8, display: "flex", alignItems: "center", gap: 6 } },
        e("i", { className: "ti ti-alert-triangle", style: { color: "#a3771f" } }),
        `Aging inventory (${agingItems.length} item${agingItems.length === 1 ? "" : "s"} 30+ days)`
      ),
      e("div", { style: { display: "flex", flexDirection: "column", gap: 6 } },
        agingItems.slice(0, 8).map(i =>
          e("div", { key: i.sku, style: { display: "flex", justifyContent: "space-between", fontSize: 13, padding: "0.4rem 0.6rem", background: "#fdf6e8", borderRadius: 8 } },
            e("span", null, `${i.brand || ""} ${i.model || ""} · ${i.sku}`),
            e("span", { style: { color: "#a3771f", fontWeight: 600 } }, `${i.daysInStock}d`)
          )
        )
      )
    ),

    sales.length === 0
      ? e("div", { style: { textAlign: "center", padding: "2rem 0", color: "var(--text-secondary)", fontSize: 14 } }, "No sales yet to report on.")
      : e("div", null,
    e("div", { style: { display: "flex", gap: 6, marginBottom: 12 } },
      e("button", {
        onClick: () => setGroupBy("platform"),
        style: { flex: 1, fontSize: 13, borderColor: groupBy === "platform" ? "var(--border-accent)" : undefined, color: groupBy === "platform" ? "var(--text-accent)" : undefined }
      }, "By platform"),
      e("button", {
        onClick: () => setGroupBy("brand"),
        style: { flex: 1, fontSize: 13, borderColor: groupBy === "brand" ? "var(--border-accent)" : undefined, color: groupBy === "brand" ? "var(--text-accent)" : undefined }
      }, "By brand")
    ),
    e("div", { style: { display: "flex", flexDirection: "column", gap: 8 } },
      groups.map(g => {
        const roi = g.cost > 0 ? round2((g.profit / g.cost) * 100) : 0;
        return e("div", { key: g.key, style: { background: "var(--surface-2)", border: "1px solid var(--border)", borderRadius: 14, boxShadow: "0 1px 2px rgba(0,0,0,0.04)", padding: "0.75rem 1rem" } },
          e("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 8 } },
            e("div", { style: { fontWeight: 600, fontSize: 14 } }, g.key),
            e("div", { style: { fontSize: 12, color: "var(--text-secondary)" } }, `${g.count} sale${g.count === 1 ? "" : "s"}`)
          ),
          e("div", { style: { display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr", gap: 4, fontSize: 12 } },
            e("div", null, e("div", { style: { color: "var(--text-secondary)" } }, "Revenue"), e("div", { style: { fontWeight: 600 } }, "$" + g.revenue.toLocaleString(undefined, { maximumFractionDigits: 0 }))),
            e("div", null, e("div", { style: { color: "var(--text-secondary)" } }, "Cost"), e("div", { style: { fontWeight: 600 } }, "$" + g.cost.toLocaleString(undefined, { maximumFractionDigits: 0 }))),
            e("div", null, e("div", { style: { color: "var(--text-secondary)" } }, "Profit"), e("div", { style: { fontWeight: 600, color: g.profit >= 0 ? "var(--text-success)" : "var(--text-danger)" } }, "$" + g.profit.toLocaleString(undefined, { maximumFractionDigits: 0 }))),
            e("div", null, e("div", { style: { color: "var(--text-secondary)" } }, "ROI"), e("div", { style: { fontWeight: 600 } }, roi + "%"))
          )
        );
      })
    )
  )
  );
}

function SellModal({ item, onCancel, onConfirm }){
  const [price, setPrice] = useState(item && item.suggestedPrice ? String(item.suggestedPrice) : "");
  const [platform, setPlatform] = useState(PLATFORMS[0]);
  if (!item) return e(ConfirmModal, { title: "SKU not found", body: "This item isn't in current stock.", confirmLabel: "OK", onCancel, onConfirm: onCancel });
  const cost = Number(item.cost) || 0;
  const profit = price ? round2(Number(price) - cost) : null;
  return e("div", { style: { position: "fixed", inset: 0, background: "rgba(0,0,0,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 100 } },
    e("div", { style: { background: "var(--surface-2)", borderRadius: 12, padding: "1.25rem", width: "90%", maxWidth: 340 } },
      e("div", { style: { fontWeight: 600, fontSize: 15, marginBottom: 4 } }, `${item.brand || ""} ${item.model || ""}`),
      e("div", { style: { fontSize: 12, color: "var(--text-secondary)", marginBottom: 12 } }, `${[item.storage, item.color].filter(Boolean).join(" · ")} · Cost $${cost}`),
      e("label", { style: { fontSize: 13, color: "var(--text-secondary)", display: "block", marginBottom: 4 } }, "Sold price"),
      e("input", { type: "number", inputMode: "decimal", placeholder: "0.00", value: price, onChange: ev => setPrice(ev.target.value), style: { width: "100%", marginBottom: 10 }, autoFocus: true }),
      e("label", { style: { fontSize: 13, color: "var(--text-secondary)", display: "block", marginBottom: 4 } }, "Platform"),
      e("select", { value: platform, onChange: ev => setPlatform(ev.target.value), style: { width: "100%", marginBottom: 10 } },
        PLATFORMS.map(p => e("option", { key: p, value: p }, p))
      ),
      profit !== null && !isNaN(profit) && e("div", { style: { fontSize: 13, marginBottom: 12, color: profit >= 0 ? "var(--text-success)" : "var(--text-danger)" } }, `Profit: ${profit >= 0 ? "+" : ""}$${profit}`),
      e("div", { style: { display: "flex", gap: 8 } },
        e("button", { onClick: onCancel, style: { flex: 1 } }, "Cancel"),
        e("button", { onClick: () => price && onConfirm(price, platform), disabled: !price, style: { flex: 1, borderColor: "var(--border-accent)", color: price ? "var(--text-accent)" : undefined } }, "Confirm sale")
      )
    )
  );
}

function AddItemModal({ onCancel, onConfirm }){
  const [form, setForm] = useState({ sku: "", rack: RACKS[0], brand: "", model: "", storage: "", color: "", carrier: "", imei: "", condition: CONDITIONS[0], cost: "", suggestedPrice: "", notes: "" });
  const set = k => ev => setForm(f => ({ ...f, [k]: ev.target.value }));
  return e("div", { style: { position: "fixed", inset: 0, background: "rgba(0,0,0,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 100 } },
    e("div", { style: { background: "var(--surface-2)", borderRadius: 12, padding: "1.25rem", width: "92%", maxWidth: 360, maxHeight: "82vh", overflowY: "auto" } },
      e("div", { style: { fontWeight: 600, fontSize: 15, marginBottom: 12 } }, "Add new item"),
      e("div", { style: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 8 } },
        e("div", null, e("label", { style: { fontSize: 12, color: "var(--text-secondary)" } }, "SKU *"), e("input", { value: form.sku, onChange: set("sku"), style: { width: "100%" } })),
        e("div", null, e("label", { style: { fontSize: 12, color: "var(--text-secondary)" } }, "Rack"),
          e("select", { value: form.rack, onChange: set("rack"), style: { width: "100%" } }, RACKS.map(r => e("option", { key: r, value: r }, r))))
      ),
      e("div", { style: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 8 } },
        e("div", null, e("label", { style: { fontSize: 12, color: "var(--text-secondary)" } }, "Brand"), e("input", { value: form.brand, onChange: set("brand"), style: { width: "100%" } })),
        e("div", null, e("label", { style: { fontSize: 12, color: "var(--text-secondary)" } }, "Model"), e("input", { value: form.model, onChange: set("model"), style: { width: "100%" } }))
      ),
      e("div", { style: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 8 } },
        e("div", null, e("label", { style: { fontSize: 12, color: "var(--text-secondary)" } }, "Storage"), e("input", { value: form.storage, onChange: set("storage"), placeholder: "128GB", style: { width: "100%" } })),
        e("div", null, e("label", { style: { fontSize: 12, color: "var(--text-secondary)" } }, "Color"), e("input", { value: form.color, onChange: set("color"), style: { width: "100%" } }))
      ),
      e("div", { style: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 8 } },
        e("div", null, e("label", { style: { fontSize: 12, color: "var(--text-secondary)" } }, "Carrier"), e("input", { value: form.carrier, onChange: set("carrier"), placeholder: "Unlocked", style: { width: "100%" } })),
        e("div", null, e("label", { style: { fontSize: 12, color: "var(--text-secondary)" } }, "Cost *"), e("input", { type: "number", inputMode: "decimal", value: form.cost, onChange: set("cost"), style: { width: "100%" } }))
      ),
      e("div", { style: { marginBottom: 8 } }, e("label", { style: { fontSize: 12, color: "var(--text-secondary)" } }, "Suggested resell price"), e("input", { type: "number", inputMode: "decimal", value: form.suggestedPrice, onChange: set("suggestedPrice"), placeholder: "Optional — used for inventory value estimate", style: { width: "100%" } })),
      e("div", { style: { marginBottom: 8 } }, e("label", { style: { fontSize: 12, color: "var(--text-secondary)" } }, "IMEI"), e("input", { value: form.imei, onChange: set("imei"), style: { width: "100%" } })),
      e("div", { style: { marginBottom: 8 } }, e("label", { style: { fontSize: 12, color: "var(--text-secondary)" } }, "Condition"),
        e("select", { value: form.condition, onChange: set("condition"), style: { width: "100%" } }, CONDITIONS.map(c => e("option", { key: c, value: c }, c)))),
      e("div", { style: { marginBottom: 14 } }, e("label", { style: { fontSize: 12, color: "var(--text-secondary)" } }, "Notes"), e("input", { value: form.notes, onChange: set("notes"), placeholder: "Battery %, cycles, etc.", style: { width: "100%" } })),
      e("div", { style: { display: "flex", gap: 8 } },
        e("button", { onClick: onCancel, style: { flex: 1 } }, "Cancel"),
        e("button", { onClick: () => onConfirm(form), disabled: !form.sku || !form.cost, style: { flex: 1, borderColor: "var(--border-accent)", color: form.sku && form.cost ? "var(--text-accent)" : undefined } }, "Add item")
      )
    )
  );
}

function DetailModal({ sku, item, onClose, onSell }){
  return e("div", { style: { position: "fixed", inset: 0, background: "rgba(0,0,0,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 100 } },
    e("div", { style: { background: "var(--surface-2)", borderRadius: 12, padding: "1.25rem", width: "90%", maxWidth: 340 } },
      !item
        ? e(React.Fragment, null,
            e("div", { style: { fontWeight: 600, marginBottom: 8 } }, `SKU ${sku} not found`),
            e("div", { style: { fontSize: 13, color: "var(--text-secondary)", marginBottom: 16 } }, "This item isn't in current stock. It may already be sold, or hasn't been added yet."),
            e("button", { onClick: onClose, style: { width: "100%" } }, "Close")
          )
        : e(React.Fragment, null,
            e("div", { style: { fontWeight: 600, fontSize: 15, marginBottom: 4 } }, `${item.brand || ""} ${item.model || ""}`),
            e("div", { style: { fontSize: 12, color: "var(--text-secondary)", marginBottom: 12 } }, item.sku),
            e("table", { style: { width: "100%", fontSize: 13, marginBottom: 16 } },
              e("tbody", null,
                [["Rack", item.rack], ["Storage", item.storage], ["Color", item.color], ["Carrier", item.carrier], ["IMEI", item.imei], ["Condition", item.condition], ["Notes", item.notes], ["Cost", item.cost ? `$${item.cost}` : ""], ["Suggested price", item.suggestedPrice ? `$${item.suggestedPrice}` : "Not set"], ["Potential profit", item.suggestedPrice && item.cost ? `$${round2(Number(item.suggestedPrice) - Number(item.cost))}` : ""]]
                  .filter(([, v]) => v)
                  .map(([k, v]) => e("tr", { key: k },
                    e("td", { style: { color: "var(--text-secondary)", padding: "4px 0", width: "40%" } }, k),
                    e("td", { style: { textAlign: "right", padding: "4px 0" } }, v)
                  ))
              )
            ),
            e("div", { style: { display: "flex", gap: 8 } },
              e("button", { onClick: onClose, style: { flex: 1 } }, "Close"),
              e("button", { onClick: onSell, style: { flex: 1, borderColor: "var(--border-accent)", color: "var(--text-accent)" } }, "Mark sold")
            )
          )
    )
  );
}

function ConfirmModal({ title, body, confirmLabel, onCancel, onConfirm }){
  return e("div", { style: { position: "fixed", inset: 0, background: "rgba(0,0,0,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 100 } },
    e("div", { style: { background: "var(--surface-2)", borderRadius: 12, padding: "1.25rem", width: "88%", maxWidth: 320 } },
      e("div", { style: { fontWeight: 600, marginBottom: 8 } }, title),
      e("div", { style: { fontSize: 13, color: "var(--text-secondary)", marginBottom: 16 } }, body),
      e("div", { style: { display: "flex", gap: 8 } },
        e("button", { onClick: onCancel, style: { flex: 1 } }, "Cancel"),
        e("button", { onClick: onConfirm, style: { flex: 1, borderColor: "var(--border-danger)", color: "var(--text-danger)" } }, confirmLabel)
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(e(App));
</script>
</body>
